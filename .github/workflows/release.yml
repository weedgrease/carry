# carry is currently Windows-only. The release job runs on a Windows runner
# and produces NSIS + MSI installers plus a portable .zip. macOS and Linux
# builds will be added later by extending this with a matrix strategy.

name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version (e.g., 1.0.0). Overrides bump if set."
        type: string
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump versions
        id: bump
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            pnpm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          else
            pnpm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          NEW=$(node -p "require('./package.json').version")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

          # core/tauri.conf.json
          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' core/tauri.conf.json > "$tmp"
          mv "$tmp" core/tauri.conf.json

          # core/Cargo.toml — only [package] version (the first ^version = line)
          sed -i 's/^version = "[^"]*"/version = "'"$NEW"'"/' core/Cargo.toml

          # core/Cargo.lock — bump the carry package's version line so the
          # lock doesn't lag behind Cargo.toml. Without this, anyone running
          # `cargo build` after pulling the bump commit gets a stale-lock
          # diff. Match by walking from `name = "carry"` to the next version.
          sed -i '/^name = "carry"$/{n;s/^version = "[^"]*"/version = "'"$NEW"'"/;}' core/Cargo.lock

      - name: Commit and tag
        run: |
          set -euo pipefail
          NEW="${{ steps.bump.outputs.version }}"
          git add package.json core/tauri.conf.json core/Cargo.toml core/Cargo.lock
          git commit -m "chore(release): v$NEW"
          git tag "v$NEW"
          git push origin HEAD:main
          git push origin "v$NEW"

  release:
    needs: prepare
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.prepare.outputs.version }}
          # Need full history (and tags) so `git describe --tags` can
          # find the previous release for the changelog generator.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Build a changelog from the commits between the previous tag and HEAD.
      # First-ever release falls back to a placeholder.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          NEW="v${{ needs.prepare.outputs.version }}"
          # Find the most recent tag *before* the one we just cut.
          PREV=$(git describe --tags --abbrev=0 "${NEW}^" 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            BODY="Initial public release. See [README](https://github.com/weedgrease/carry#readme) for what carry does and how to install it."
          else
            COMMITS=$(git log "${PREV}..${NEW}" --pretty=format:"- %s" --no-merges)
            BODY=$'## What changed since '"$PREV"$'\n\n'"$COMMITS"
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$BODY"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: "carry v${{ needs.prepare.outputs.version }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          projectPath: .

      - name: Package portable .exe
        id: portable
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $exe = "core/target/release/carry.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected $exe to exist after Tauri build. Inspect upload-artifact output."
            exit 1
          }
          $zip = "carry-$version-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          echo "path=$zip" >> $env:GITHUB_OUTPUT

      - name: Attach portable .zip to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" "${{ steps.portable.outputs.path }}" --clobber
