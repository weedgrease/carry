name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version (e.g., 1.0.0). Overrides bump if set."
        type: string
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump versions
        id: bump
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            pnpm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          else
            pnpm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          NEW=$(node -p "require('./package.json').version")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

          # core/tauri.conf.json
          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' core/tauri.conf.json > "$tmp"
          mv "$tmp" core/tauri.conf.json

          # core/Cargo.toml — only [package] version (the first ^version = line)
          sed -i 's/^version = "[^"]*"/version = "'"$NEW"'"/' core/Cargo.toml

      - name: Commit and tag
        run: |
          set -euo pipefail
          NEW="${{ steps.bump.outputs.version }}"
          git add package.json core/tauri.conf.json core/Cargo.toml
          git commit -m "chore(release): v$NEW"
          git tag "v$NEW"
          git push origin HEAD:main
          git push origin "v$NEW"

  release:
    needs: prepare
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: "Carry v${{ needs.prepare.outputs.version }}"
          releaseBody: "See assets to download and install this version."
          releaseDraft: true
          prerelease: false
          projectPath: .

      - name: Package portable .exe
        id: portable
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $exe = "core/target/release/carry.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected $exe to exist after Tauri build. Inspect upload-artifact output."
            exit 1
          }
          $zip = "carry-$version-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          echo "path=$zip" >> $env:GITHUB_OUTPUT

      - name: Attach portable .zip to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.prepare.outputs.version }}" "${{ steps.portable.outputs.path }}" --clobber

      - name: Upload all bundle outputs as workflow artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carry-${{ needs.prepare.outputs.version }}-bundle
          path: |
            core/target/release/bundle/**/*
            core/target/release/carry.exe
            ${{ steps.portable.outputs.path }}
          if-no-files-found: warn
